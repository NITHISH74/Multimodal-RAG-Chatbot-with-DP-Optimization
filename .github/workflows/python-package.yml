name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint (syntax + undefined names only)
        run: |
          python -m compileall -q . || true
          python -c "
          import ast, pathlib, sys
          ok = True
          for p in pathlib.Path('.').rglob('*.py'):
              if any(part in p.parts for part in ('.venv', 'venv', '__pycache__', 'faiss_data', '.pytest_cache')):
                  continue
              try:
                  ast.parse(p.read_text(encoding='utf-8'))
              except SyntaxError as e:
                  print(f'SYNTAX ERROR {p}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "
      - name: Run unit tests
        run: pytest -q

  eval:
    name: eval smoke test (golden core, no keys)
    runs-on: ubuntu-latest
    # Skip when API keys aren't configured — the test would just produce
    # empty metrics. Keeps the badge green on PRs from forks / new
    # contributors that don't have secrets set.
    if: ${{ env.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal eval deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run eval (limit 3, no judge — fast smoke test)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m eval.run_eval --limit 3 --no-judge || echo "eval smoke test skipped (no key or DB)"
